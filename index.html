
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ساعة ذكية عالمية متطورة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    
    .watch {
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #111, #000);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 50px rgba(0, 201, 255, 0.5);
      border: 20px solid #222;
    }
    
    .time {
      font-size: 4rem;
      font-weight: 300;
      letter-spacing: 3px;
      color: #00e5ff;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
    }
    
    .date {
      font-size: 1.5rem;
      color: #aaa;
      margin-top: 10px;
    }
    
    .location {
      font-size: 1.2rem;
      color: #888;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="watch">
    <div class="time" id="time">00:00:00</div>
    <div class="date" id="date">الأحد, 1 يناير 2023</div>
    <div class="location" id="location">الرباط, المغرب</div>
  </div>
  
  <script>
    function activateFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    }
    
    function updateTime() {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      
      document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
      
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('ar-MA', options);
      
      const utcHours = now.getUTCHours();
      const utcMinutes = now.getMinutes();
      document.getElementById('location').textContent = `UTC+${utcHours}:${utcMinutes.toString().padStart(2, '0')}`;
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      activateFullscreen();
      updateTime();
      setInterval(updateTime, 1000);
      
      document.addEventListener('click', () => {
        if (document.fullscreenElement === null) {
          activateFullscreen();
        }
      });
    });
  </script>
</body>
</html>
